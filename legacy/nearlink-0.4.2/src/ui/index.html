<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Nearlink</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">↗</span> nearlink<span class="brand-dot">.</span></div>
    <div class="workspace-label">YOUR WORKSPACE</div>
    <nav id="navigation"></nav>
    <div class="nearby-heading"><span>NEARBY DEVICES</span><button class="icon-button" data-action="refresh" title="Refresh devices" aria-label="Refresh devices">↻</button></div>
    <div id="device-list"></div>
    <div class="sidebar-bottom"><span class="status-dot"></span><div><span>Local network only</span><small>No cloud. Just your computers.</small></div></div>
  </aside>
  <div class="workspace">
    <header><div class="breadcrumb">WORKSPACE <span>/</span> <span id="page-label">Overview</span></div><div class="header-actions"><button id="theme-toggle" data-action="toggle-theme" aria-label="Switch to dark mode" aria-pressed="false">☾ Dark mode</button><div class="network-pill"><span class="status-dot"></span> Private connection</div></div></header>
    <div id="pairings"></div>
    <main id="main"><p>Starting your local workspace…</p></main>
    <footer><span id="footer-device"></span><span>Encrypted in transit <span class="footer-dot">·</span> Direct device-to-device</span></footer>
  </div>
  <div id="toast" role="alert" hidden></div>
  <script src="file-view.js"></script>
  <script src="app.js"></script>
</body></html>
